name: Production monitor and incident triage

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production URL to verify"
        required: false
        default: "https://nimbus-assistant-production.vercel.app"
  repository_dispatch:
    types: [sentry-issue]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Probe production
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ inputs.production_url || 'https://nimbus-assistant-production.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production probes
        id: probe
        continue-on-error: true
        run: node scripts/production-monitor.mjs "$PRODUCTION_URL" > production-monitor.json
      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: production-monitor.json
      - name: Generate evidence-bound bugfix plan
        if: steps.probe.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'gpt-6-astra' }}
        run: node scripts/create-bugfix-plan.mjs --source monitor --input production-monitor.json > bugfix-plan.md
      - name: Upload bugfix plan
        if: steps.probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-bugfix-plan-${{ github.run_id }}
          path: bugfix-plan.md
      - name: Create or update incident issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ github.workspace }}/production-monitor.json
          PLAN: ${{ github.workspace }}/bugfix-plan.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            const plan = fs.readFileSync(process.env.PLAN, "utf8");
            const fingerprint = report.fingerprint || "unknown";
            const title = `Production monitor failure: ${fingerprint}`;
            const body = `${plan}\n\nMonitor run: ${process.env.RUN_URL}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing incident issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Created incident issue #${created.data.number}`);
            }

  sentry-triage:
    name: Create Sentry bugfix plan
    if: github.event_name == 'repository_dispatch' && github.event.action == 'sentry-issue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate evidence-bound bugfix plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'gpt-6-astra' }}
          TRIAGE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/create-bugfix-plan.mjs --source sentry > bugfix-plan.md
      - name: Upload bugfix plan
        uses: actions/upload-artifact@v4
        with:
          name: sentry-bugfix-plan-${{ github.run_id }}
          path: bugfix-plan.md
      - name: Create or update bugfix-plan issue
        uses: actions/github-script@v7
        env:
          PLAN: ${{ github.workspace }}/bugfix-plan.md
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        with:
          script: |
            const fs = require("node:fs");
            const payload = JSON.parse(process.env.PAYLOAD || "{}");
            const shortId = String(payload.issue_short_id || payload.short_id || "unknown").replace(/[^A-Za-z0-9_.:-]/g, "_").slice(0, 80);
            const title = `Bugfix plan: ${shortId}`;
            const body = fs.readFileSync(process.env.PLAN, "utf8");
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing bugfix-plan issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`Created bugfix-plan issue #${created.data.number}`);
            }
