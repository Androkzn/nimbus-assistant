name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      eval_base_url:
        description: "Run the live answer eval against this URL (needs EVAL_BYPASS_TOKEN secret)"
        required: false

jobs:
  quality-gates:
    name: Offline quality gates (no API keys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + integration + retrieval eval
        run: npm test
      - name: Bundle scanner self-test (planted keys must be caught)
        run: node scripts/scan-client-bundle.mjs --self-test
      - name: Build
        run: npm run build
      - name: Client bundle secret scan
        run: npm run scan:bundle
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (mock LLM)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  live-eval:
    name: Live answer eval (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.eval_base_url != ''
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/eval-live.mjs --base-url "${{ inputs.eval_base_url }}"
        env:
          EVAL_BYPASS_TOKEN: ${{ secrets.EVAL_BYPASS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link the Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@62.7.0 link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
      - name: Deploy the tested commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx --yes vercel@62.7.0 deploy --prod --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
      - name: Verify the public production alias
        env:
          PRODUCTION_URL: https://nimbus-assistant-production.vercel.app
        run: |
          curl --fail --silent --show-error "$PRODUCTION_URL/api/health"
          curl --fail --silent --show-error "$PRODUCTION_URL/api/models" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/readiness?autostart=1")" = "404"
